# Application Configuration
spring.application.name=adventure-game

# Server - Render uses PORT env variable
server.port=${PORT:10000}

# Database - Using in-memory storage, H2 as fallback
spring.datasource.url=jdbc:h2:mem:adventure;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.h2.enabled=true

# JPA - Disabled, using in-memory repository
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JWT
app.jwt.secret=${JWT_SECRET: adventure-game-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256 }
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# H2 Console - disabled for production, enable if needed for debugging
spring.h2.console.enabled=false

# Logging
logging.level.com.adventure=INFO