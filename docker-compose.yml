version: '3.8'

services:
  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adventure-backend
    environment:
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - adventure-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${BACKEND_URL:-http://localhost:8080}
    container_name: adventure-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - adventure-network
    restart: unless-stopped

networks:
  adventure-network:
    driver: bridge