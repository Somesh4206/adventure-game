services:
  - type: web
    name: adventure-game-backend
    env: java
    region: oregon
    plan: free
    branch: master
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/adventure-game-1.0.0.jar
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
